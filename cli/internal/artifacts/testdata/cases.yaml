#
# Each entry names a file under testdata/ and the result the loader must
# return for it. `expect: ok` means the file loads. Any other value is a
# substring of the error message. `platform` is the target platform the
# loader checks image outputs against. It defaults to linux/amd64.

- file: valid.json
  expect: ok
- file: valid.json
  platform: linux/arm64
  expect: 'outputs[name=controller-profiles]: no manifest for platform linux/arm64'
- file: cases/valid-nico-absent.json
  expect: ok
- file: cases/valid-extra-outputs-and-keys.json
  expect: ok
- file: nvkr/helm-export.json
  expect: 'required output "cwe" is missing'
- file: nvkr/exec-export.json
  expect: 'required output "cwe" is missing'
- file: cases/not-json.json
  expect: 'not valid JSON'
- file: cases/missing-schema-version.json
  expect: 'schemaVersion is required'
- file: cases/unknown-schema-version.json
  expect: 'unsupported schemaVersion "nvkr.dev/release-description/v9"'
- file: cases/duplicate-output-name.json
  expect: 'outputs[name=cwe]: appears twice'
- file: cases/missing-required-output.json
  expect: 'required output "spire" is missing'
- file: cases/nico-without-prereqs.json
  expect: 'output "nico-prereqs" is required when "nico" is present'
- file: cases/image-wrong-kind.json
  expect: 'outputs[name=cwe]: kind "executable", want "oci"'
- file: cases/chart-wrong-kind.json
  expect: 'outputs[name=spire]: kind "oci", want "helm-oci"'
- file: cases/reference-missing.json
  expect: 'outputs[name=cwe]: reference is missing'
- file: cases/reference-without-digest.json
  expect: 'outputs[name=cwe]: reference has no digest'
- file: cases/image-platform-missing.json
  expect: 'outputs[name=cwe]: no manifest for platform linux/amd64'
- file: cases/image-index-platform-missing.json
  expect: 'outputs[name=cwe]: no manifest for platform linux/amd64'
- file: cases/chart-without-version.json
  expect: 'outputs[name=temporal]: chartVersion is missing'
- file: cases/chart-version-out-of-range.json
  expect: 'outputs[name=postgresql]: chartVersion "17.0.0" is outside the supported range'
- file: cases/source-missing.json
  expect: 'outputs[name=cwe]: no evidence carries a source'
